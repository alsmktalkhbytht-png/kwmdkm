<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 324 196" role="img" aria-label="BIOS">
  <defs>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8364a"/><stop offset=".45" stop-color="#8a2233"/><stop offset="1" stop-color="#4f0f1c"/>
    </linearGradient>
    <linearGradient id="mau" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0cf86"/><stop offset=".55" stop-color="#d4a54e"/><stop offset="1" stop-color="#a87a2c"/>
    </linearGradient>
    <linearGradient id="mfold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a87a2c"/><stop offset=".5" stop-color="#d4a54e"/><stop offset="1" stop-color="#f0cf86"/>
    </linearGradient>
    <clipPath id="mc"><path d="M34 8 H270 L304 42 V156 Q233 144 162 172 Q91 144 20 156 V22 Q20 8 34 8 Z"/></clipPath>
    <pattern id="mdots" width="9" height="9" patternUnits="userSpaceOnUse">
