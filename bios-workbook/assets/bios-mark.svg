  </defs>
  <!-- page block under the tile (book thickness) -->
  <path d="M20 156 Q91 144 162 172 Q233 144 304 156 V163 Q233 151 162 179 Q91 151 20 163 Z" fill="#f8eedc"/>
  <path d="M20 163 Q91 151 162 179 Q233 151 304 163 V168 Q233 156 162 185 Q91 156 20 168 Z" fill="url(#mau)"/>
